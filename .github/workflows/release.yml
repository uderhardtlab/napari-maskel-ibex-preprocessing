# Publishes to PyPI when a version tag is pushed, e.g.
#   git tag v0.1.0
#   git push origin v0.1.0
# The tag must match the version in pyproject.toml (checked below).
# Uses PyPI "trusted publishing" (OIDC): no password or token is stored in the repository.
# One-time setup on pypi.org (account of the maintainer): Your projects / Publishing ->
# "Add a new pending publisher": owner uderhardtlab, repository napari-maskel-ibex-preprocessing,
# workflow release.yml, environment pypi.
name: release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Tag must match the version in pyproject.toml
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          TAG=${GITHUB_REF_NAME#v}
          echo "pyproject version: $VERSION, tag: $TAG"
          test "$VERSION" = "$TAG"
      - name: Build and check
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/napari-maskel-ibex-preprocessing
    permissions:
      id-token: write          # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
