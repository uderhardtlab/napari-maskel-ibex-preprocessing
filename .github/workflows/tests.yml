# Runs the tests on every push and pull request (Windows, Linux, macOS; Python 3.9-3.12),
# and checks that the package builds and its metadata are valid.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[testing]"
      - name: Test (core algorithms, synthetic data)
        run: python -m pytest -v tests

  build:
    name: build and check the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
      - name: Check metadata (twine)
        run: python -m twine check --strict dist/*
      - name: Check that logo and napari manifest are in the wheel
        run: |
          python -m zipfile -l dist/*.whl | grep -q "napari.yaml"
          python -m zipfile -l dist/*.whl | grep -q "resources/logo_preprocessing.png"
